name: ci

on:
  push:
  pull_request:

jobs:
  self-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Self-test
        run: php keybleed.php --self-test
      - name: This repository stays clean
        run: php keybleed.php . --fail-on=low
